{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>InSillyClo - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'frontend/styles.css' %}">

</head>

<body>

<nav class="navbar navbar-expand-md navbar-light bg-light border-bottom border-3">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">InSillyClo</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto mb-2 mb-md-0">
                <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="/campaigns/simulator/browse/">Assemblies</a></li>
                <li class="nav-item"><a class="nav-link" href="/campaigns/simulator/">Simulations</a></li>
                <li class="nav-item"><a class="btn btn-simulator ms-md-3" href="/accounts/login/">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<section class="login-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="login-container">
          <div class="login-panel">
            <h2 class="panel-title">I ALREADY HAVE AN ACCOUNT</h2>
            
            <form class="login-form">
              <div class="form-group">
                <label for="email" class="form-label">EMAIL <span class="required">*</span></label>
                <input type="email" id="email" name="email" class="form-input" required>
              </div>
              
              <div class="form-group">
                <label for="password" class="form-label">PASSWORD <span class="required">*</span></label>
                <input type="password" id="password" name="password" class="form-input" required>
              </div>
              
              <button type="submit" class="btn-login">LOGIN</button>
            </form>
            
            <button type="button" class="btn-reset">RESET MY PASSWORD</button>
          </div>
          <div class="login-panel login-panel-right">
            <h2 class="panel-title panel-title-right">I AM NOT REGISTERED YET</h2>
            <button type="button" class="btn-create">CREATE ACCOUNT</button>
          </div>
          
        </div>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container text-center">
    M2 AMI2B - Web Programming Project - 2025/2026
    <br>
    Institut Pasteur / InSillyClo - Educational use
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
