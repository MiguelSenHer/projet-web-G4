{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Assemblies</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'frontend/styles.css' %}">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    {% include 'frontend/navbar.html' %}

<h1 class="col-12 text-center text-uppercase">
    Assembly Designer
</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
<div class="mb-3">
    <label class="form-label requiredField">
        Name of the assembly<span class="asteriskField">*</span>
    </label>
    {{ form.name }}
</div>
<div class="mb-3">
    <label class="form-label">
        Comment
    </label>
    {{ form.comment }}
</div>
<div class="mb-3">
    <label class="form-label requiredField">
        Naming convention for the output separator
        <span class="asteriskField">*</span>
    </label>
    {{ form.separator }}
    <div class="form-text">
        
    </div>
</div>
<div class="mb-3">
    <label class="form-label requiredField">
        Restriction enzyme<span class="asteriskField">*</span>
    </label>
    {{ form.restriction_enzyme }}
</div>
<div class="text-center mt-3">
    <a href="{% url 'designer_properties' %}?reset">
        clear form
    </a>
</div>
<div class="text-center mt-5">
    <button class="btn btn-auto" type="submit">
        Next
    </button>
</div>
</form>

    <!-- FOOTER -->
    {% include 'frontend/footer.html' %}

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
