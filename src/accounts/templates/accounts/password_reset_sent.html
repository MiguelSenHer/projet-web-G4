{% extends "frontend/base.html" %}

{% block title %}
Password Reset - InSillyClo
{% endblock %}

{% block content %}

<section class="login-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="login-container">
          <div class="login-panel">

            <h2 class="panel-title">RESET EMAIL SENT</h2>

            <div class="form-success" style="text-align: center;">
              <p class="success-message">
                A password reset link has been sent to your email.<br>
                Please note that it <strong>expires in 10 minutes</strong>.
              </p>
            </div>

            <a href="{% url 'login' %}" class="btn-login d-block text-center" style="text-decoration: none;">
              BACK TO LOGIN
            </a>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
