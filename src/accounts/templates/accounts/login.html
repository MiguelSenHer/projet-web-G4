{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>InSillyClo - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'frontend/styles.css' %}">

</head>

<body>

{% include 'frontend/navbar.html' %}

<section class="login-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="login-container">
          <div class="login-panel">
            <h2 class="panel-title">I ALREADY HAVE AN ACCOUNT</h2>
            
            <form method="post" class="login-form" action="{% url 'login' %}">
              {% csrf_token %}
              
              {% if form.errors %}
                <div class="form-errors">
                  <p class="error-message">Invalid email or password. Please try again.</p>
                </div>
              {% endif %}
              
              <div class="form-group">
                <label for="id_username" class="form-label">EMAIL <span class="required">*</span></label>
                <input type="email" id="id_username" name="username" class="form-input" required autofocus>
              </div>
              
              <div class="form-group">
                <label for="id_password" class="form-label">PASSWORD <span class="required">*</span></label>
                <input type="password" id="id_password" name="password" class="form-input" required>
              </div>
              
              <input type="hidden" name="next" value="{{ next }}">
              
               <button type="submit" class="btn-login">LOGIN</button>
              <!--<a href="{% url 'password_reset' %}" class="btn-login d-block text-center" style="text-decoration:none;">
                Reset Password -->

              </a> 
              <a href="/accounts/password-reset/" class="btn-login d-block text-center" style="text-decoration:none;">
                Reset Password
              </a>

            </form>
          </div>
          <div class="login-panel login-panel-right">
            <h2 class="panel-title panel-title-right" style="text-align: center;">I AM NOT REGISTERED YET</h2>
            <a href="{% url 'signup' %}" class="btn-create" style="text-decoration: none; text-align: center;">CREATE ACCOUNT</a>
          </div>
          
        </div>
      </div>
    </div>
  </div>
</section>

{% include 'frontend/footer.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
