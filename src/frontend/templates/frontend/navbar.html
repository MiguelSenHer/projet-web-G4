{% load static %}
<nav class="navbar navbar-expand-md navbar-light bg-light border-bottom border-3">
  <div class="container-fluid">

    <!-- Brand -->
    <a class="navbar-brand fw-bold" href="/">InSillyClo</a>

    <!-- Burger -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNav"
      aria-controls="mainNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links -->
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto mb-2 mb-md-0">

        <!-- Home -->
        <li class="nav-item">
          <a
            class="nav-link {% if active_page == 'home' %}active{% endif %}"
            href="/"
          >
            Home
          </a>
        </li>

        <!-- New simulation -->
        <li class="nav-item">
          <a
            class="nav-link {% if active_page == 'simulator' %}active{% endif %}"
            href="/campaigns/simulator/"
          >
            New simulation
          </a>
        </li>

        <!-- Assemblies -->
        <li class="nav-item">
          <a
            class="nav-link {% if active_page == 'browse' %}active{% endif %}"
            href="/campaigns/simulator/browse/"
          >
            Browse assemblies
          </a>
        </li>

        <!-- Simulations -->
        <li class="nav-item">
          <a
            class="nav-link {% if active_page == 'simulations' %}active{% endif %}"
            href="/campaigns/simulator/simulations/"
          >
            Simulations
          </a>
        </li>

        {% if user.is_authenticated %}

          <!-- Profile -->
          <li class="nav-item">
            <a
              class="nav-link {% if active_page == 'profile' %}active{% endif %}"
              href="/accounts/profile/"
            >
              Profile
            </a>
          </li>

          <!-- Logout -->
          <li class="nav-item ms-md-2">
            <form method="post" action="{% url 'logout' %}" class="d-inline">
              {% csrf_token %}
              <button type="submit" class="btn btn-simulator">
                Logout
              </button>
            </form>
          </li>

        {% else %}

          <!-- Login -->
          <li class="nav-item ms-md-3">
            <a class="btn btn-simulator" href="/accounts/login/">
              Login
            </a>
          </li>

        {% endif %}

      </ul>
    </div>
  </div>
</nav>
